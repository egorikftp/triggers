name: fetch users online

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Dry-run: log backend writes instead of performing them'
        type: boolean
        default: false
  schedule:
    - cron:  '*/5 * * * *'

jobs:
  build:
    uses: ./.github/workflows/run-jar.yml
    with:
      task: users-online
      debug: ${{ inputs.debug }}
    secrets: inherit
