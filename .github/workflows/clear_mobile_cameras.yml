name: clear mobile cameras

on:
  schedule:
    - cron:  '0 17 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Dry-run: log backend writes instead of performing them'
        type: boolean
        default: false
jobs:
  build:
    uses: ./.github/workflows/run-jar.yml
    with:
      task: mobile-cameras-clear
      debug: ${{ inputs.debug || false }}
    secrets: inherit
