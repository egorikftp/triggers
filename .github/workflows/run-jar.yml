name: run jar (reusable)

on:
  workflow_call:
    inputs:
      task:
        description: 'Argument passed to the jar (empty runs the default/test task)'
        required: false
        type: string
        default: ''
      google_credentials_env:
        description: 'Whether to set GOOGLE_APPLICATION_CREDENTIALS for the run step'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ inputs.google_credentials_env && 'src/main/resources/service_account.json' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Add nested repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPO_PATH }}
          token: ${{ secrets.REPO_TOKEN }}

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: run jar
        run: java -Xms128m -Xmx512m -jar jar/grodno-roads-github-actions.jar ${{ inputs.task }}
