name: run jar (reusable)

on:
  workflow_call:
    inputs:
      task:
        description: 'Argument passed to the jar (empty runs the default/test task)'
        required: false
        type: string
        default: ''
      debug:
        description: 'Dry-run: pass --debug to the jar (backend writes are skipped)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-slim
    # ubuntu-slim has no UTF-8 locale in the environment, so JDK 17 (pre-JEP 400)
    # falls back to a US-ASCII default charset and println mangles Cyrillic to '?'.
    # C.UTF-8 is built into Ubuntu 24.04, no locale installation needed.
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Add nested repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPO_PATH }}
          token: ${{ secrets.REPO_TOKEN }}

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: run jar
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service_account.json
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          java -Xms128m -Xmx512m -jar jar/grodno-roads-github-actions.jar ${{ inputs.task }} ${{ inputs.debug && '--debug' || '' }}
